<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Painel</title><style>
body{margin:0;background:#0a0a0a;color:#fff;font-family:Arial}.top{padding:18px 6%;background:#000;border-bottom:2px solid red;display:flex;justify-content:space-between}.main{max-width:850px;margin:30px auto;padding:0 18px}.box{background:#111;border:1px solid #333;border-radius:14px;padding:25px;margin-bottom:25px}label{display:block;margin:15px 0;font-weight:bold}input,textarea{width:100%;box-sizing:border-box;padding:13px;background:#050505;color:#fff;border:1px solid #444;border-radius:7px;margin-top:6px}button{background:red;color:#fff;border:0;padding:13px 18px;border-radius:7px;font-weight:bold;cursor:pointer}.previews{display:flex;gap:10px;overflow:auto}.previews img{width:100px;height:80px;object-fit:cover;border-radius:7px}.post{padding:12px;border-bottom:1px solid #333;display:flex;gap:15px;align-items:center}.post span{margin-left:auto;color:#aaa}.del{background:#333}
</style></head><body><header class="top"><b>FLAVINHO <span style="color:red">VEÍCULOS</span></b><div><a href="index.html" style="color:white;margin-right:15px">Ver site</a><button id="logout" class="del">Sair</button></div></header><main class="main"><section class="box"><h1>Nova publicação</h1><form id="postForm"><label>Nome do veículo<input id="title" required placeholder="Honda Civic 2014"></label><label>Preço<input id="price" placeholder="R$ 100.000"></label><label>Descrição<textarea id="desc" rows="5" placeholder="Completo, automático, flex..."></textarea></label><label>Fotos<input id="photos" type="file" accept="image/*" multiple required></label><div class="previews" id="preview"></div><br><button>PUBLICAR</button><p id="status"></p></form></section><section class="box"><h2>Publicações</h2><div id="list"></div></section></main><script type="module" src="admin.js"></script></body></html>
